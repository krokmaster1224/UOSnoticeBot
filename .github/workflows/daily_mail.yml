name: UOS Daily Notice Bot

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write      # 웹페이지 자동 배포 권한 추가
  id-token: write   # 웹페이지 자동 배포 인증 추가

jobs:
  send-notice:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 공지 수집, 이메일 발송 및 노션 배너 생성
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          pip install feedparser
          python uos_bot.py

      - name: 4. 기록장(seen_links.txt) 및 배너(index.html) 저장
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add seen_links.txt index.html || true
          git diff --staged --quiet || git commit -m "Update notices and Notion banner"
          git push

      - name: 5. GitHub Pages 웹사이트 즉시 반영하기
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 6. 웹사이트 배포 완료
        id: deployment
        uses: actions/deploy-pages@v4
