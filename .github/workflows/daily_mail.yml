name: UOS Daily Notice Bot

on:
  schedule:
    # UTC 23:30 = 한국 시간 매일 오전 8시 30분
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-notice:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 공지 수집, 이메일 발송 및 노션 배너 생성
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          pip install feedparser
          python uos_bot.py

      - name: 4. 기록장(seen_links.txt) 및 배너(index.html) 안전하게 저장
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add seen_links.txt index.html || true
          git diff --staged --quiet || (git commit -m "Update notices and Notion banner" && git pull --rebase && git push)
